[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = [
  "cd packages/database && pnpm prisma generate && pnpm run build && cd ../..",
  "cd apps/api && pnpm run build"
]

[start]
cmd = "cd apps/api && node dist/main.js"
