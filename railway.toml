[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --no-frozen-lockfile && cd packages/database && pnpm prisma generate && pnpm run build && cd ../.. && cd apps/api && pnpm run build"

[deploy]
startCommand = "cd apps/api && node dist/main.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
